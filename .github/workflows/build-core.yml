# core 이미지 빌드 → GHCR push → deployment.yaml에 커밋 SHA + digest 고정.
# ----------------------------------------------------------------------------
# 왜: 이전까지 core는 :latest 하나로 굴러갔다. 그러면 (1) 되돌릴 주소가 없고,
# (2) Deployment revision이 전부 같은 문자열이라 kubectl rollout undo가 무의미하고,
# (3) :latest의 기본 pull 정책이 Always라 노드 drain·OOMKill·evict로 Pod이 재생성될 때
# 배포한 적 없는 이미지가 조용히 올라온다. 커밋 SHA 태그로 그 셋을 한 번에 닫는다.
#
# digest까지 박는 이유: 같은 커밋에서 워크플로를 재실행하면 sha-<short> 태그는 같지만
# base image(python:3.12-slim)가 그 사이 갱신됐으면 다른 바이트가 된다. 태그만 고정하면
# 그 경로가 열려 있다 — digest가 "정확히 이 바이트"를 잠근다. (태그는 사람이 읽는 용도로
# 같이 남긴다. K8s는 태그+digest가 같이 있으면 digest를 따른다.)
name: Build Core Image

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/build-core.yml"
  workflow_dispatch:          # 코드 변경 없이 base image만 갱신하고 싶을 때 수동 실행

permissions:
  contents: write             # deployment.yaml 이미지 고정 커밋을 되돌려 push
  packages: write             # GHCR push

# 이미지 태그 고정 커밋이 서로를 덮지 않게 직렬화. 취소하지 않는 이유는
# 중간 실행이 취소되면 그 커밋의 이미지가 GHCR에 영영 안 올라가기 때문.
concurrency:
  group: build-core
  cancel-in-progress: false

jobs:
  build:
    # 클러스터 노드가 OCI ARM A1이라 arm64 네이티브 러너를 쓴다 (public repo 무료).
    # QEMU 에뮬레이션이면 pip install 단계가 몇 배로 늘어난다.
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 고정 커밋을 되돌려 push할 때 rebase가 필요 — shallow면 깨진다

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그 계산
        id: vars
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/kodeploy-core" >> "$GITHUB_OUTPUT"

      - name: 빌드 + push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./core
          platforms: linux/arm64
          push: true
          # latest는 사람이 ad-hoc으로 당겨보는 용도로만 남긴다 — 배포는 항상 아래 digest 고정본.
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          # 레이어 캐시는 일부러 안 붙였다. 첫 시도에서 type=gha를 얹었다가 빌드 시작 18초 만에
          # 죽었는데, permissions 블록을 명시하면 안 적은 스코프(actions)가 none이 되어 Actions
          # 캐시 서비스에 접근을 못 하는 게 원인으로 보인다. 붙이려면 actions: write를 함께 주고,
          # 캐시 없는 기준선 빌드 시간을 먼저 재서 실제로 이득이 있는지 확인한 뒤에 (user 빌드의
          # BUILD_REGISTRY_CACHE를 기본 OFF로 두고 전후 비교하는 것과 같은 순서).

      - name: deployment.yaml에 이미지 고정
        id: pin
        run: |
          set -euo pipefail
          IMAGE="${{ steps.vars.outputs.image }}"
          TAG="${{ steps.vars.outputs.tag }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          REF="${IMAGE}:${TAG}@${DIGEST}"
          FILE=deploy/k8s/core/deployment.yaml

          # 이 줄만 갈아끼운다 (앞의 들여쓰기 보존, 뒤는 통째 교체 — 그래서 이 줄엔 주석을 달지 않는다)
          sed -i -E "s#^(\s*image: ).*kodeploy-core.*#\1${REF}#" "$FILE"

          if ! grep -q "${DIGEST}" "$FILE"; then
            echo "✗ 이미지 줄을 못 바꿨다 — deployment.yaml의 image 줄 형식을 확인할 것"
            grep -n "image:" "$FILE"
            exit 1
          fi
          echo "pinned=${REF}" >> "$GITHUB_OUTPUT"
          echo "고정: ${REF}"

      - name: 고정 커밋 push
        run: |
          set -euo pipefail
          if git diff --quiet -- deploy/k8s/core/deployment.yaml; then
            echo "이미 같은 이미지 — 커밋할 것 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/core/deployment.yaml
          git commit -m "chore(k8s): pin core image to ${{ steps.vars.outputs.tag }}"
          # 이 커밋은 deploy/k8s/**만 건드리므로 core/** 경로 필터에 안 걸린다 — 재실행 루프 없음
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 배포 명령 안내
        run: |
          {
            echo "### core 이미지 빌드 완료"
            echo ""
            echo '```'
            echo "${{ steps.pin.outputs.pinned }}"
            echo '```'
            echo ""
            echo "적용 (managed 노드에서):"
            echo '```sh'
            echo "git pull && kubectl apply -f deploy/k8s/core/deployment.yaml"
            echo "kubectl rollout status deployment/kodeploy-core -n default"
            echo '```'
            echo ""
            echo "되돌리기:"
            echo '```sh'
            echo "kubectl rollout undo deployment/kodeploy-core -n default"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
