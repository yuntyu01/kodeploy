---
- name: Base setup for all K8s nodes
  hosts: all
  become: yes
  tasks: 
    - name: SELinux permissive
      selinux:
        policy: targeted
        state: permissive

    - name: swap 끄기
      command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: swap 영구 비활성화
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'

    - name: k8s 필수 커널 모듈 활성화
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: K8s sysctl
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: sysctl 적용
      command: sysctl --system

    - name: /etc/hosts에 노드 등록
      lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item].ansible_host | default(hostvars[item].ansible_default_ipv4.address) }} {{ item }}"
        regexp: "\\s{{ item }}$"
        state: present
      loop: "{{ groups['all'] }}"

    - name: firewalld 끄기 (개발단계)
      systemd:
        name: firewalld
        state: stopped
        enabled: no
      ignore_errors: yes

    # dnf-makecache.timer가 주기적으로 RPM 메타데이터를 갱신하면서 RSS 2GB+ 스파이크
    # → 4GB master에서 global OOM 트리거 → BestEffort K8s 파드(calico 등) 1순위 희생
    # 모든 노드에 동일 적용(워커도 빌드 Job과 겹치면 같은 문제 발생 가능)
    # disable만 하면 systemd 의존성으로 부활 가능 → masked로 강제 잠금
    - name: dnf-makecache.timer 정지 및 mask
      systemd:
        name: dnf-makecache.timer
        state: stopped
        enabled: no
        masked: yes

    # timer를 꺼도 `dnf install` 호출 시 stale metadata면 자동 갱신 시도함 → 그 경로도 차단
    - name: dnf 자동 메타데이터 갱신 비활성화
      blockinfile:
        path: /etc/dnf/dnf.conf
        block: |
          keepcache=0
          metadata_expire=-1
        marker: "# {mark} ANSIBLE MANAGED — IaC mode"

    - name: 기존 dnf 캐시 정리
      command: dnf clean all
      changed_when: true