---
- name: Base setup for all K8s nodes
  hosts: all
  become: yes
  tasks: 
    - name: SELinux permissive
      selinux:
        policy: targeted
        state: permissive

    - name: swap 끄기
      command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: swap 영구 비활성화
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'

    - name: k8s 필수 커널 모듈 활성화
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: K8s sysctl
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: K8s sysctl
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: sysctl 적용
      command: sysctl --system

    - name: /etc/hosts에 노드 등록
      lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item].ansible_host | default(hostvars[item].ansible_default_ipv4.address) }} {{ item }}"
        regexp: "\\s{{ item }}$"
        state: present
      loop: "{{ groups['all'] }}"

    - name: firewalld 끄기 (개발단계)
      systemd:
        name: firewalld
        state: stopped
        enabled: no
      ignore_errors: yes