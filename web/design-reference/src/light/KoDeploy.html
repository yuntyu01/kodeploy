<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>KoDeploy — Kubernetes 기반 배포 워크스페이스</title>

<link rel="stylesheet" href="notion-tokens.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'n-bg':        '#ffffff',
          'n-bg-alt':    '#f6f5f4',
          'n-bg-side':   '#f9f8f7',
          'n-text':      'rgba(0,0,0,0.95)',
          'n-text-2':    '#615d59',
          'n-text-3':    '#a39e98',
          'n-border':    'rgba(0,0,0,0.1)',
          'n-border-soft':'rgba(0,0,0,0.06)',
          'n-blue':      '#0075de',
          'n-blue-dark': '#005bab',
          'n-blue-bg':   '#f2f9ff',
          'n-green':     '#1aae39',
          'n-orange':    '#dd5b00',
          'n-teal':      '#2a9d99',
        },
        fontFamily: {
          sans: ['NotionInter', 'Inter', '"Pretendard Variable"', 'Pretendard', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'SF Mono', 'Menlo', 'monospace'],
        },
        boxShadow: {
          'n-card': 'rgba(0,0,0,0.04) 0px 4px 18px, rgba(0,0,0,0.027) 0px 2.025px 7.84688px, rgba(0,0,0,0.02) 0px 0.8px 2.925px, rgba(0,0,0,0.01) 0px 0.175px 1.04062px',
          'n-deep': 'rgba(0,0,0,0.01) 0px 1px 3px, rgba(0,0,0,0.02) 0px 3px 7px, rgba(0,0,0,0.02) 0px 7px 15px, rgba(0,0,0,0.04) 0px 14px 28px, rgba(0,0,0,0.05) 0px 23px 52px',
        },
      }
    }
  }
</script>

<style>
  html, body, #root {
    background: #ffffff;
    color: rgba(0,0,0,0.95);
    font-family: 'NotionInter', Inter, 'Pretendard Variable', Pretendard, system-ui, sans-serif;
    font-feature-settings: 'lnum', 'locl';
    -webkit-font-smoothing: antialiased;
  }
  * { font-feature-settings: 'lnum', 'locl'; }
  .scroll-thin::-webkit-scrollbar { width: 10px; height: 10px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }
  .scroll-thin::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 5px; }
  .scroll-thin::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.16); }
  @keyframes n-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }
  .n-live-dot { animation: n-pulse 1.6s ease-in-out infinite; }
  @keyframes n-fade-in {
    from { opacity: 0; transform: translateY(2px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .n-log-line { animation: n-fade-in 200ms ease-out; }
  .n-fade-in { animation: n-fade-in 160ms ease-out; }
  .n-btn-press:active { transform: scale(0.96); }
</style>
</head>
<body class="overflow-hidden">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>

  <script type="text/babel" data-presets="react" src="KoDeploy.jsx"></script>
</body>
</html>
