- name: Gateway API CRD 설치
  hosts: managed
  become: false
  vars:
    gateway_api_version: v1.2.0
    crd_url: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml"
  tasks:
    - name: Gateway API CRD apply
      command: kubectl apply -f {{ crd_url }}
      register: apply_result
      changed_when:
        - "'created' in apply_result.stdout or 'configured' in apply_result.stdout"

    - name: 설치 확인 (4개 CRD 존재해야 함)
      command: kubectl get crd {{ item }}
      loop:
        - gatewayclasses.gateway.networking.k8s.io
        - gateways.gateway.networking.k8s.io
        - httproutes.gateway.networking.k8s.io
        - referencegrants.gateway.networking.k8s.io
      changed_when: false
