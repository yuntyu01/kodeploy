apiVersion: v1
kind: ConfigMap                                          # 비밀이 아닌 환경변수/설정 묶음 (Secret과 분리)
metadata:
  name: kodeploy-core-env
data:
  GHCR_USER: "yuntyu01"                                  # GHCR 이미지 푸시/풀 시 owner 경로
  DB_HOST: "mysql"                                       # 운영 mysql Service 이름 (DNS로 접근)
  DB_USER: "kodeploy"
  DB_NAME: "kodeploy"
  ALLOWED_ORIGINS: "https://kodeploy.pages.dev,http://localhost:5173,http://127.0.0.1:5173"  # CORS 허용 origin (쉼표 구분)

  # --- Auth (비밀 아님) ---
  # 콜백 URL은 GitHub OAuth App 등록값과 정확히 일치해야 함 (백엔드 origin 기준).
  GITHUB_OAUTH_REDIRECT_URI: "https://api.kodeploy.com/auth/github/callback"
  # 로그인 성공 후 사용자를 돌려보낼 web 기본 URL. dev에선 로컬 vite, 운영 옮기면 변경.
  WEB_BASE_URL: "http://localhost:5173"
  # web(localhost:5173) ↔ api(api.kodeploy.com)가 cross-site라 SameSite=None + Secure 필수.
  # 같은 *.kodeploy.com으로 옮기면 lax로 강화 가능.
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_SAMESITE: "none"
