apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  namespace: monitoring
  labels:
    app: victoriametrics
spec:
  serviceName: victoriametrics
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.117.1
          args:
            - -storageDataPath=/data
            - -retentionPeriod=30d
            - -memory.allowedPercent=60
          ports:
            - containerPort: 8428
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8428
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8428
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: monitoring
  labels:
    app: victoriametrics
spec:
  ports:
    - port: 8428
      targetPort: 8428
      name: http
  selector:
    app: victoriametrics
