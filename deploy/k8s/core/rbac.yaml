apiVersion: v1
kind: ServiceAccount                                     # Pod에 붙는 K8s 내부 신원 (토큰 자동 mount)
metadata:
  name: kodeploy-core
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole                                        # 클러스터 전역 권한 (ns 무관 — kodeploy-build, tenant-xxx 모두 적용)
metadata:
  name: kodeploy-core
rules:
  - apiGroups: ["batch"]                                 # BuildKit 빌드 Job 관리용 (kodeploy-build ns)
    resources: ["jobs", "jobs/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]                                  # 유저 앱 Deployment + mysql StatefulSet 관리용 (tenant ns)
    resources: ["deployments", "deployments/status", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]                                      # core API 그룹
    resources: ["namespaces"]                            # 테넌트 ns 프로비저닝/삭제
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods", "pods/log", "pods/exec",  # pods/exec=터미널 WebSocket
                "secrets", "resourcequotas",
                "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["projectcalico.org"]                     # Calico NetworkPolicy (per-tenant 격리)
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]             # 유저 앱 서브도메인 라우팅용
    resources: ["httproutes"]
    verbs: ["get", "list", "create", "delete"]            # delete=앱 삭제 시 라우트 정리
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding                                 # SA를 ClusterRole에 연결 
metadata:
  name: kodeploy-core
subjects:
  - kind: ServiceAccount                                 
    name: kodeploy-core
    namespace: default
roleRef:
  kind: ClusterRole                                      # 어떤 권한을 (위에서 정의한 ClusterRole)
  name: kodeploy-core
  apiGroup: rbac.authorization.k8s.io                    # RBAC v1 그룹 (빠뜨리면 validation 에러)
