services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: kodeploy
      MYSQL_USER: kodeploy
      MYSQL_PASSWORD: kodeploy
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      retries: 10

  api:
    build: ./core
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: kodeploy
      DB_PASSWORD: kodeploy
      DB_NAME: kodeploy
      ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      WEB_BASE_URL: "http://localhost:5173"
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_OAUTH_REDIRECT_URI: "http://localhost:8000/auth/github/callback"
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: "lax"
      # SESSION_COOKIE_DOMAIN 비워서 localhost에 쿠키 붙게
      GHCR_USER: ${GHCR_USER:-yuntyu01}

volumes:
  mysql-data:
