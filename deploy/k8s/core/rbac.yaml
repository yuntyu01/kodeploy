apiVersion: v1
kind: ServiceAccount
metadata:
  name: kodeploy-core
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kodeploy-core
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kodeploy-core
  namespace: default
subjects:
  - kind: ServiceAccount
    name: kodeploy-core
    namespace: default
roleRef:
  kind: Role
  name: kodeploy-core
  apiGroup: rbac.authorization.k8s.io
