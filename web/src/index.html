<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>KoDeploy — Kubernetes 기반 배포 워크스페이스</title>

<link rel="stylesheet" href="linear-tokens.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'kd-bg':       '#08090a',
          'kd-panel':    '#0f1011',
          'kd-surface':  '#191a1b',
          'kd-surface2': '#28282c',
          'fg-1':        '#f7f8f8',
          'fg-2':        '#d0d6e0',
          'fg-3':        '#8a8f98',
          'fg-4':        '#62666d',
          'indigo-brand':'#5e6ad2',
          'violet-brand':'#7170ff',
          'violet-hov':  '#828fff',
          'green-ok':    '#10b981',
          'amber-warn':  '#f59e0b',
          'red-err':     '#ef4444',
        },
        fontFamily: {
          sans: ['"Inter Variable"', 'Inter', '"Pretendard Variable"', 'Pretendard', 'system-ui', 'sans-serif'],
          mono: ['"Berkeley Mono"', '"JetBrains Mono"', 'ui-monospace', 'SF Mono', 'Menlo', 'monospace'],
        },
        fontWeight: {
          'med': '510',
          'emp': '590',
        },
        boxShadow: {
          'inset-deep': 'rgba(0,0,0,0.2) 0px 0px 12px 0px inset',
          'ring-1':     'rgba(0,0,0,0.2) 0px 0px 0px 1px',
          'dialog':     '0 8px 24px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.06)',
        },
      }
    }
  }
</script>

<style>
  html, body, #root {
    background: #08090a;
    color: #f7f8f8;
    font-family: 'Inter Variable', Inter, 'Pretendard Variable', Pretendard, system-ui, sans-serif;
    font-feature-settings: 'cv01', 'ss03';
    -webkit-font-smoothing: antialiased;
  }
  * { font-feature-settings: 'cv01', 'ss03'; }
  /* scrollbars in panels */
  .scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }
  .scroll-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 4px; }
  .scroll-thin::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); }
  /* tab indicator transition */
  .kd-tab-ind { transition: transform 160ms ease-out, width 160ms ease-out; }
  /* subtle blink for live dot */
  @keyframes kd-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }
  .kd-live-dot { animation: kd-pulse 1.6s ease-in-out infinite; }
  /* fade-in for incoming log lines */
  @keyframes kd-fade-in {
    from { opacity: 0; transform: translateY(2px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .kd-log-line { animation: kd-fade-in 200ms ease-out; }
  .kd-fade-in { animation: kd-fade-in 160ms ease-out; }
  /* sparkline grid */
  .kd-grid-bg {
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 40px 32px;
  }
</style>
</head>
<body class="overflow-hidden">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- lucide as global, then a tiny shim so we can write <Icon name="..."/> -->
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>

  <script type="text/babel" data-presets="react" src="components/shared.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/data.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/TopBar.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/views.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/LeftPanel.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/DeployModal.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/DeployWidget.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/SetupView.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/LoginModal.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/Toast.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/ModeToggle.jsx"></script>
  <script type="text/babel" data-presets="react" src="App.jsx"></script>
</body>
</html>
