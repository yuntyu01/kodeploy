services:
  mysql:
    image: mysql:8.4
    env_file: .env
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
