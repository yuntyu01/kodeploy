# ============================================================================
# 68-origin-mtls.yml — 오리진 잠금 레이어 B (mTLS / Cloudflare Authenticated Origin Pulls)
# ----------------------------------------------------------------------------
# 자체 CA(67-tls-selfsigned가 만든 ca.key/ca.crt)로 "origin-pull client cert"를 발급한다.
#   - 이 client cert+key는 Cloudflare에 업로드 → CF가 오리진(Envoy)에 연결할 때 제시.
#   - Envoy ClientTrafficPolicy는 이 cert가 우리 CA로 서명됐는지 검증 → 우리 CF zone만 통과.
# CF 공유 origin-pull cert가 아니라 "자체 cert"를 쓰는 게 핵심(공유 cert면 남의 CF zone도 통과).
#
# 산출물:
#   .tls-selfsigned/origin-pull.{key,crt}  → CF에 업로드 (per-hostname AOP)
#   deploy/k8s/gateway/cf-origin-ca.configmap.yaml → Envoy clientValidation용 CA (공개 검증용)
#
# 선행: 67-tls-selfsigned.yml (ca.key/ca.crt 생성). kubectl(로컬, admin.conf)로 ConfigMap YAML 생성.
# ============================================================================
- name: Cloudflare AOP용 origin-pull client cert 발급 (자체 CA 서명)
  hosts: localhost
  connection: local
  vars:
    domain: kodeploy.com
    cert_dir: "{{ playbook_dir }}/../../.tls-selfsigned"
    ca_configmap_path: "{{ playbook_dir }}/../../deploy/k8s/gateway/cf-origin-ca.configmap.yaml"
  tasks:
    - name: 기존 CA 존재 확인 (먼저 67-tls-selfsigned.yml 실행돼 있어야 함)
      stat:
        path: "{{ cert_dir }}/ca.crt"
      register: ca_stat

    - name: CA 없으면 중단
      fail:
        msg: "{{ cert_dir }}/ca.crt 없음 — 먼저 67-tls-selfsigned.yml 실행 필요"
      when: not ca_stat.stat.exists

    - name: origin-pull client 개인키 생성
      command: openssl genrsa -out {{ cert_dir }}/origin-pull.key 4096
      args:
        creates: "{{ cert_dir }}/origin-pull.key"

    - name: client cert 확장 설정 (clientAuth EKU)
      copy:
        dest: "{{ cert_dir }}/origin-pull.cnf"
        content: |
          [req]
          distinguished_name = dn
          [dn]
          [v3_client]
          extendedKeyUsage = clientAuth
          keyUsage = critical, digitalSignature

    - name: CSR 생성
      command: >
        openssl req -new
        -key {{ cert_dir }}/origin-pull.key
        -subj "/CN=origin-pull.{{ domain }}"
        -out {{ cert_dir }}/origin-pull.csr
      args:
        creates: "{{ cert_dir }}/origin-pull.csr"

    - name: 자체 CA로 client cert 서명 (1년)
      command: >
        openssl x509 -req
        -in {{ cert_dir }}/origin-pull.csr
        -CA {{ cert_dir }}/ca.crt
        -CAkey {{ cert_dir }}/ca.key
        -CAcreateserial
        -days 365 -sha256
        -extensions v3_client
        -extfile {{ cert_dir }}/origin-pull.cnf
        -out {{ cert_dir }}/origin-pull.crt
      args:
        creates: "{{ cert_dir }}/origin-pull.crt"

    # CA cert는 비밀이 아님(공개 검증용) → ConfigMap. kubectl dry-run으로 안전하게 YAML 생성.
    - name: Envoy clientValidation용 CA ConfigMap YAML 생성
      shell: >
        kubectl create configmap cf-origin-ca
        --namespace default
        --from-file=ca.crt={{ cert_dir }}/ca.crt
        --dry-run=client -o yaml > {{ ca_configmap_path }}
      environment:
        KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig/admin.conf"

    - name: 다음 단계 안내
      debug:
        msg:
          - "CF 업로드용 client cert : {{ cert_dir }}/origin-pull.crt"
          - "CF 업로드용 client key  : {{ cert_dir }}/origin-pull.key"
          - "Envoy CA ConfigMap      : {{ ca_configmap_path }}"
          - "다음: cf-origin-ca ConfigMap + origin-mtls.yaml(optional:true) apply → CF AOP 활성 → 확인 후 optional:false"
