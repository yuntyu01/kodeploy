# ============================================================================
# origin-mtls.yaml — 오리진 잠금 레이어 B (Envoy mTLS / client cert 검증)
# ----------------------------------------------------------------------------
# kodeploy Gateway의 https(443) 리스너에서만 client cert를 검증한다.
#   - CF가 Authenticated Origin Pulls로 제시하는 origin-pull cert가 우리 CA(cf-origin-ca)로
#     서명됐는지 Envoy가 확인 → 우리 CF zone을 거친 트래픽만 통과.
#   - http(80) 리스너는 대상 아님(301 redirect 전용이라 잠글 필요 없음).
#
# ⚠️ 적용 순서: CF AOP(terraform cloudflare/origin-mtls.tf)를 "먼저" 켜서 CF가 cert를 제시하게
#    한 뒤 이 정책(optional:false=강제)을 적용한다. 순서가 반대면 AOP 활성 전까지 모든
#    *.kodeploy.com이 525/526으로 끊긴다(프로덕션 트래픽 없으면 무해하나 본인 테스트도 막힘).
#    핸드셰이크 디버깅이 필요하면 optional:true로 임시 완화(cert 있으면 검증, 없어도 통과) 후 복귀.
#
# 의존: cf-origin-ca ConfigMap(키 ca.crt) — 68-origin-mtls.yml이 생성하는
#       deploy/k8s/gateway/cf-origin-ca.configmap.yaml 을 먼저 apply.
# ============================================================================
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: origin-mtls
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kodeploy
      sectionName: https          # https(443) 리스너만 — http(80, redirect)는 제외
  tls:
    clientValidation:
      optional: false             # 강제: client cert 없는 핸드셰이크 거절. CF AOP 켠 뒤 적용할 것.
      caCertificateRefs:
        - group: ""               # core API group (ConfigMap)
          kind: ConfigMap
          name: cf-origin-ca      # 키 ca.crt = 자체 CA (CF origin-pull cert 검증용)
