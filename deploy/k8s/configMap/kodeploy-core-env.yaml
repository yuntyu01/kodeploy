apiVersion: v1
kind: ConfigMap                                          # 비밀이 아닌 환경변수/설정 묶음 (Secret과 분리)
metadata:
  name: kodeploy-core-env
data:
  GHCR_USER: "yuntyu01"                                  # GHCR 이미지 푸시/풀 시 owner 경로
  CF_ACCOUNT_ID: "4a73c7440c6c59e668d89d6f06c4813e"                                      # Cloudflare 계정 ID (R2 endpoint·API 경로 파생). 대시보드 사이드바에서 복사해 채우기
  CF_ZONE_ID: "2fec3004cefff9a5e7fef294f4312816"                                          # kodeploy.com zone ID — 커스텀 도메인(CF for SaaS custom hostname) zone-scoped API용
  DB_HOST: "mysql"                                       # 운영 mysql Service 이름 (DNS로 접근)
  DB_USER: "kodeploy"
  DB_NAME: "kodeploy"
  ALLOWED_ORIGINS: "https://app.kodeploy.com,https://kodeploy.pages.dev,http://localhost:5173,http://127.0.0.1:5173"
  GITHUB_OAUTH_REDIRECT_URI: "https://api.kodeploy.com/auth/github/callback"
  GITHUB_APP_ID: "3794809"                               # GitHub App 숫자 ID — installation token JWT 서명(iss)용. 공개값
  GITHUB_APP_SLUG: "kodeploy"                             # App 슬러그(github.com/apps/kodeploy) — private repo 연결 설치 페이지 링크용
  WEB_BASE_URL: "https://app.kodeploy.com"
  # app.kodeploy.com ↔ api.kodeploy.com = same-site → Lax + Domain 공유
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_SAMESITE: "lax"
  SESSION_COOKIE_DOMAIN: ".kodeploy.com"
